<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>StitchWorld Lace Chart Browser</title>
<style>
:root {
    color-scheme: light;
    --bg: #f3efe4;
    --panel: #fffdf7;
    --ink: #2f261a;
    --muted: #766650;
    --line: #d8ccb7;
    --accent: #9c4f2f;
    --accent-soft: #f1ddd1;
}

* {
    box-sizing: border-box;
}

html,
body {
    height: 100%;
    margin: 0;
}

body {
    font-family: Georgia, "Times New Roman", serif;
    background: radial-gradient(circle at top, #fff9ef 0%, var(--bg) 58%, #e7dcc7 100%);
    color: var(--ink);
}

.layout {
    display: grid;
    grid-template-columns: 18rem 1fr;
    height: 100vh;
}

.sidebar {
    display: grid;
    grid-template-rows: auto 1fr;
    border-right: 1px solid var(--line);
    background: linear-gradient(180deg, rgba(255, 253, 247, 0.96), rgba(247, 240, 226, 0.96));
    padding: 1rem;
    gap: 1rem;
    min-height: 0;
    backdrop-filter: blur(8px);
}

.sidebar-top {
    min-height: 0;
}

.title {
    margin: 0 0 0.25rem;
    font-size: 1.35rem;
    line-height: 1.1;
}

.subtitle {
    margin: 0 0 1rem;
    color: var(--muted);
    font-size: 0.95rem;
}

.controls {
    display: grid;
    gap: 0.75rem;
    margin-bottom: 1rem;
}

label {
    display: grid;
    gap: 0.35rem;
    font-size: 0.85rem;
    color: var(--muted);
}

input,
select,
button {
    font: inherit;
}

input,
select {
    width: 100%;
    padding: 0.55rem 0.65rem;
    border: 1px solid var(--line);
    border-radius: 0.5rem;
    background: var(--panel);
    color: var(--ink);
}

.nav-buttons {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 0.5rem;
}

button {
    padding: 0.6rem 0.75rem;
    border: 1px solid var(--line);
    border-radius: 999px;
    background: var(--panel);
    color: var(--ink);
    cursor: pointer;
}

button:hover {
    border-color: var(--accent);
    background: var(--accent-soft);
}

.list {
    min-height: 0;
    overflow: auto;
    padding-right: 0.35rem;
    display: grid;
    gap: 0.3rem;
}

.list button {
    text-align: left;
    border-radius: 0.65rem;
    padding: 0.55rem 0.7rem;
}

.list button.active {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff8ef;
}

.viewer-shell {
    display: grid;
    grid-template-rows: 1fr;
    min-width: 0;
    min-height: 0;
}

.viewer-content {
    display: grid;
    grid-template-columns: 30% 1fr;
    grid-template-rows: 1fr;
    min-height: 0;
}

.viewer-pane {
    position: relative;
    min-height: 0;
    overflow: hidden;
}

.left-column {
    display: grid;
    grid-template-rows: 1fr 1fr;
    min-height: 0;
    overflow: hidden;
    border-right: 1px solid var(--line);
}

.chart-output-pane {
    border-top: 1px solid var(--line);
    background: var(--panel);
    overflow: auto;
    padding: 1rem;
    display: flex;
    align-items: center;
    justify-content: center;
}

.chart-pane {
    overflow: hidden;
    background: var(--panel);
}

#tiled-output {
    width: 100%;
    height: 100%;
}

.chart-grid {
    display: inline-grid;
    gap: 1px;
    background: #ccc;
    border: 1px solid #ccc;
}

.chart-cell {
    display: flex;
    align-items: center;
    justify-content: center;
    background: white;
    box-sizing: border-box;
}

.chart-cell img {
    width: 100%;
    height: 100%;
    display: block;
}

.image-pane {
    border-right: 1px solid var(--line);
    display: flex;
    background: var(--panel);
    overflow: auto;
}

.image-wrapper {
    position: relative;
    margin: auto;
    display: inline-flex;
    height: calc(100% - 2rem);
    border: 1px solid var(--line);
    background: white;
    padding-left: var(--pixel-size, 0px);
}

.image-wrapper img {
    height: 100%;
    width: auto;
    max-width: none;
    display: block;
    image-rendering: pixelated;
}

.grid-overlay {
    position: absolute;
    top: 0;
    right: 0;
    bottom: 0;
    left: var(--pixel-size, 0px);
    pointer-events: none;
    background-position: bottom left;
    background-image: 
        linear-gradient(to right, rgba(0,0,0,0.8) 2px, transparent 2px),
        linear-gradient(to top, rgba(0,0,0,0.8) 2px, transparent 2px),
        linear-gradient(to right, rgba(0,0,0,0.3) 1px, transparent 1px),
        linear-gradient(to top, rgba(0,0,0,0.3) 1px, transparent 1px);
}

.row-markers {
    position: absolute;
    top: 0;
    bottom: 0;
    left: 0;
    width: var(--pixel-size, 0px);
    pointer-events: none;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    overflow: hidden;
}

.row-marker {
    height: var(--pixel-size, 0px);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: calc(var(--pixel-size, 0px) * 0.8);
    font-family: sans-serif;
    color: black;
    line-height: 1;
}

.marker-n {
    width: 65%;
    height: 65%;
    border: 1px solid var(--ink);
}

.marker-f {
    width: 65%;
    height: 65%;
    background-color: var(--ink);
}

iframe {
    width: 100%;
    height: 100%;
    border: 0;
    background: white;
}

@media (max-width: 900px) {
    .layout {
        grid-template-columns: 1fr;
        grid-template-rows: auto 1fr;
    }

    .sidebar {
        border-right: 0;
        border-bottom: 1px solid var(--line);
        max-height: 45vh;
    }
}
</style>
</head>
<body>
<div class="layout">
    <aside class="sidebar">
        <div class="sidebar-top">
            <h1 class="title">StitchWorld Lace Chart Browser</h1>
            <p class="subtitle">Browse the generated lace charts.</p>

            <div class="controls">
                <label>
                    Jump to pattern
                    <select id="pattern-select"></select>
                </label>

                <label>
                    Filter patterns
                    <input id="pattern-filter" type="search" placeholder="Type a number">
                </label>

                <div class="nav-buttons">
                    <button id="prev-button" type="button">Previous</button>
                    <button id="next-button" type="button">Next</button>
                </div>
            </div>
        </div>

        <div class="list" id="pattern-list"></div>
    </aside>

    <main class="viewer-shell">
        <div class="viewer-content">
            <div class="left-column">
                <div class="viewer-pane image-pane">
                    <div class="image-wrapper" id="image-wrapper">
                        <div class="row-markers" id="row-markers"></div>
                        <img id="pattern-image" src="" alt="Original pattern">
                        <div class="grid-overlay" id="grid-overlay"></div>
                    </div>
                </div>
                <div class="viewer-pane chart-output-pane">
                    <div id="chart-output"></div>
                </div>
            </div>
            <div class="viewer-pane chart-pane">
                <div id="tiled-output"></div>
            </div>
        </div>
    </main>
</div>

<script>
async function getAyabSymbols(url) {
    try {
        const res = await fetch(url);
        const buffer = await res.arrayBuffer();
        const dataView = new DataView(buffer);
        
        // Check signature
        if (dataView.getUint32(0) !== 0x89504E47 || dataView.getUint32(4) !== 0x0D0A1A0A) {
            return null;
        }
        
        let offset = 8;
        while (offset < buffer.byteLength) {
            const length = dataView.getUint32(offset);
            const type = String.fromCharCode(
                dataView.getUint8(offset + 4),
                dataView.getUint8(offset + 5),
                dataView.getUint8(offset + 6),
                dataView.getUint8(offset + 7)
            );
            
            if (type === 'tEXt') {
                let chunkOffset = offset + 8;
                let chunkEnd = chunkOffset + length;
                let keyword = '';
                while (chunkOffset < chunkEnd) {
                    const char = dataView.getUint8(chunkOffset);
                    if (char === 0) {
                        chunkOffset++;
                        break;
                    }
                    keyword += String.fromCharCode(char);
                    chunkOffset++;
                }
                if (keyword === 'Comment') {
                    const textDecoder = new TextDecoder('utf-8');
                    const comment = textDecoder.decode(new Uint8Array(buffer, chunkOffset, chunkEnd - chunkOffset));
                    if (comment.startsWith('AYAB:')) {
                        return comment.substring(5).trim();
                    }
                }
            }
            
            offset += 8 + length + 4; // 4 length + 4 type + length + 4 crc
        }
    } catch (e) {
        console.error('Failed to read PNG metadata:', e);
    }
    return null;
}

const patterns = Array.from({ length: 222 - 103 + 1 }, (_, index) => {
    const number = 103 + index;
    return {
        number,
        label: String(number),
        file: `StitchWorld/${number}_chart.html`,
        imageFile: `StitchWorld/${number}.png`,
    };
});

const image = document.getElementById('pattern-image');
const imageWrapper = document.getElementById('image-wrapper');
const gridOverlay = document.getElementById('grid-overlay');
const rowMarkers = document.getElementById('row-markers');
const chartOutput = document.getElementById('chart-output');

/**
 * Reads image pixels into a boolean 2D array and packages the symbols.
 * Input:
 * - sourceImage: An HTMLImageElement containing the PNG pattern
 * - ayabSymbols: A string of metadata characters like "111N111..."
 * Output:
 * {
 *   width: number,
 *   height: number,
 *   rows: boolean[][] (true if pixel is black),
 *   ayabSymbols: string | null
 * }
 */
const extractPatternData = (sourceImage, ayabSymbols) => {
    if (!sourceImage.naturalWidth || !sourceImage.naturalHeight) return null;

    const canvas = document.createElement('canvas');
    canvas.width = sourceImage.naturalWidth;
    canvas.height = sourceImage.naturalHeight;
    const ctx = canvas.getContext('2d', {willReadFrequently: true});
    ctx.drawImage(sourceImage, 0, 0);
    const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height).data;

    const width = canvas.width;
    const height = canvas.height;
    const rows = [];
    
    for (let y = 0; y < height; y++) {
        const row = [];
        for (let x = 0; x < width; x++) {
            const i = (y * width + x) * 4;
            row.push(imgData[i] < 128 && imgData[i + 3] > 128);
        }
        rows.push(row);
    }

    return { width, height, rows, ayabSymbols };
};

/**
 * Transforms the raw boolean mask into the structural AYAB format.
 * Input:
 * - patternData: The output from `extractPatternData`
 * Output:
 * {
 *   mergedBlocks: { label: string, cells: string[], rowNum: number | null, startRow: number | null }[],
 *   ayabSymbols: string | null,
 *   ayabBlocks: { [row: number]: number } | null
 * }
 */
const generateChartData = (patternData) => {
    if (!patternData) return null;
    
    const { width, height, rows, ayabSymbols } = patternData;

    const chartRows = [];
    for (let knitRow = 1; knitRow <= height; knitRow++) {
        const y = height - knitRow;
        const rightRow = (knitRow % 2 === 0);
        let holeAction = 'hole';
        if (ayabSymbols && ayabSymbols.length >= knitRow) {
            if (ayabSymbols[knitRow - 1] === 'F') holeAction = 'fine-hole';
        }
        
        let cells = Array(width).fill('knit');
        const rowPixels = rows[y];
        for (let x = 0; x < width; x++) {
            const isBlack = rowPixels[x];
            if (isBlack) {
                if (rightRow) {
                    cells[x] = holeAction;
                    cells[(x + 1) % width] = 'transfer-right';
                } else {
                    cells[x] = holeAction;
                    cells[(x - 1 + width) % width] = 'transfer-left';
                }
            }
        }
        chartRows.push({ rowNum: knitRow, cells });
    }

    let ayabBlocks = null;
    if (ayabSymbols && ayabSymbols.length >= height) {
        ayabBlocks = {};
        let blockNum = 1;
        for (let r = 1; r <= height; r++) {
            const sym = ayabSymbols[r - 1];
            ayabBlocks[r] = blockNum;
            if (sym >= '1' && sym <= '9') blockNum++;
        }
    }

    let mergedBlocks = [];
    if (!ayabBlocks) {
        mergedBlocks = chartRows.map(r => ({ label: String(r.rowNum), cells: r.cells, rowNum: r.rowNum, startRow: r.rowNum }));
    } else {
        const rowsByBlock = {};
        const blockOrder = [];
        for (const row of chartRows) {
            const b = ayabBlocks[row.rowNum];
            if (!rowsByBlock[b]) {
                rowsByBlock[b] = [];
                blockOrder.push(b);
            }
            rowsByBlock[b].push(row);
        }

        for (const b of blockOrder) {
            const blockRows = rowsByBlock[b];
            let mergedCells = [...blockRows[0].cells];
            let startRow = blockRows[0].rowNum;
            const endRow = blockRows[blockRows.length - 1].rowNum;

            for (let i = 1; i < blockRows.length; i++) {
                const topCells = blockRows[i].cells;
                for (let x = 0; x < width; x++) {
                    const bottom = mergedCells[x];
                    const top = topCells[x];
                    if (bottom === 'knit' && top === 'knit') mergedCells[x] = 'knit';
                    else if (bottom === 'knit') mergedCells[x] = top;
                    else if (top === 'knit') mergedCells[x] = bottom;
                    else if ((bottom === 'transfer-right' && top === 'transfer-left') || (bottom === 'transfer-left' && top === 'transfer-right')) mergedCells[x] = 'crossover';
                    else if ((top === 'transfer-right' || top === 'transfer-left') && (bottom === 'hole' || bottom === 'fine-hole')) mergedCells[x] = top;
                    else mergedCells[x] = top;
                }
            }
            const label = startRow === endRow ? String(startRow) : `${startRow}-${endRow}`;
            mergedBlocks.push({ label, cells: mergedCells, rowNum: endRow, startRow });

            const sym = ayabSymbols[endRow - 1];
            if (sym >= '3' && sym <= '9') {
                const extra = parseInt(sym, 10) - 2;
                for (let i = 0; i < extra; i++) {
                    mergedBlocks.push({ label: '', cells: Array(width).fill('knit'), startRow: null, rowNum: null });
                }
            }
        }
    }

    // Pass to mark the ends of consecutive transfer sequences
    for (const block of mergedBlocks) {
        if (!block.cells) continue;
        const original = [...block.cells];
        for (let x = 0; x < width; x++) {
            if (original[x] === 'transfer-right' && original[(x + 1) % width] !== 'transfer-right') {
                block.cells[x] = 'transfer-right-end';
            }
            if (original[x] === 'transfer-left' && original[(x - 1 + width) % width] !== 'transfer-left') {
                block.cells[x] = 'transfer-left-end';
            }
        }
    }

    return { mergedBlocks, ayabSymbols, ayabBlocks };
};

/**
 * Render the abstract chart blocks into DOM elements.
 * Input:
 * - chartData: The output from `generateChartData`
 * - container: The DOM element to populate
 */
const renderChart = (chartData, container) => {
    container.innerHTML = '';
    if (!chartData || chartData.mergedBlocks.length === 0) return;
    const { mergedBlocks } = chartData;

    const cols = mergedBlocks[0].cells.length;
    const rows = mergedBlocks.length;

    const MARGIN = 32; // px, ~2rem
    const pane = container.parentElement;
    const availW = pane.clientWidth - MARGIN * 2;
    const availH = pane.clientHeight - MARGIN * 2;
    const cellSize = Math.max(4, Math.min(
        Math.floor(availW / (cols + 1)),  // +1 accounts for gap pixels
        Math.floor(availH / (rows + 1))
    ));

    const width = mergedBlocks[0].cells.length;

    const grid = document.createElement('div');
    grid.className = 'chart-grid';
    grid.style.gridTemplateColumns = `repeat(${width}, ${cellSize}px)`;

    const GLYPH_MAP = {
        'knit':               'glyphs/U002D.svg',
        'hole':               'glyphs/U006F.svg',
        'fine-hole':          'glyphs/U006F.svg',
        'transfer-right':     'glyphs/U002F.svg',
        'transfer-right-end': 'glyphs/UF055.svg',
        'transfer-left':      'glyphs/U005C.svg',
        'transfer-left-end':  'glyphs/UF056.svg',
        'crossover':          'glyphs/UF06A.svg',
    };

    const reversed = [...mergedBlocks].reverse();
    for (let i = 0; i < reversed.length; i++) {
        const b = reversed[i];

        for (const type of b.cells) {
            const cell = document.createElement('div');
            cell.className = `chart-cell chart-cell--${type}`;
            const src = GLYPH_MAP[type];
            if (src) {
                const img = document.createElement('img');
                img.src = src;
                img.alt = type;
                cell.appendChild(img);
            }
            grid.appendChild(cell);
        }
    }
    container.appendChild(grid);
};

/**
 * Render the chart tiled to fill the given number of columns and rows.
 * Input:
 * - chartData: The output from `generateChartData`
 * - container: The DOM element to populate
 */
const renderTiledChart = (chartData, container) => {
    container.innerHTML = '';
    if (!chartData || chartData.mergedBlocks.length === 0) return;
    const { mergedBlocks } = chartData;

    const patternRows = [...mergedBlocks].reverse();
    const numRows = patternRows.length;
    const width = patternRows[0].cells.length;

    const CELL_SIZE_PX = 14; // 0.875rem at 16px base
    const pane = container.parentElement;
    const tiledCols = Math.max(1, Math.floor(pane.clientWidth / CELL_SIZE_PX));
    const tiledRows = Math.max(1, Math.floor(pane.clientHeight / CELL_SIZE_PX));

    const grid = document.createElement('div');
    grid.className = 'chart-grid';
    grid.style.gridTemplateColumns = `repeat(${tiledCols}, 0.875rem)`;
    grid.style.gridTemplateRows = `repeat(${tiledRows}, 0.875rem)`;
    grid.style.overflow = 'hidden';

    const GLYPH_MAP = {
        'knit':               'glyphs/U002D.svg',
        'hole':               'glyphs/U006F.svg',
        'fine-hole':          'glyphs/U006F.svg',
        'transfer-right':     'glyphs/U002F.svg',
        'transfer-right-end': 'glyphs/UF055.svg',
        'transfer-left':      'glyphs/U005C.svg',
        'transfer-left-end':  'glyphs/UF056.svg',
        'crossover':          'glyphs/UF06A.svg',
    };

    for (let r = 0; r < tiledRows; r++) {
        const patternRow = patternRows[r % numRows];
        for (let c = 0; c < tiledCols; c++) {
            const type = patternRow.cells[c % width];
            const cell = document.createElement('div');
            cell.className = `chart-cell chart-cell--${type}`;
            const src = GLYPH_MAP[type];
            if (src) {
                const img = document.createElement('img');
                img.src = src;
                img.alt = type;
                cell.appendChild(img);
            }
            grid.appendChild(cell);
        }
    }
    container.appendChild(grid);
};

const updateGridScale = () => {
    if (!image.naturalHeight) return;
    const scale = image.clientHeight / image.naturalHeight;
    imageWrapper.style.setProperty('--pixel-size', `${scale}px`);
    // Thick lines every 5 pixels, thin lines every 1 pixel
    gridOverlay.style.backgroundSize = `${scale * 5}px ${scale * 5}px, ${scale * 5}px ${scale * 5}px, ${scale}px ${scale}px, ${scale}px ${scale}px`;
};

const renderRowMarkers = (ayabSymbols) => {
    if (!image.naturalHeight) return;
    rowMarkers.innerHTML = '';
    for (let i = image.naturalHeight - 1; i >= 0; i--) {
        const marker = document.createElement('div');
        marker.className = 'row-marker';
        let symbol = '';
        if (ayabSymbols && ayabSymbols.length > i) {
            symbol = ayabSymbols[i];
        }
        
        if (symbol === 'N') {
            const square = document.createElement('div');
            square.className = 'marker-n';
            marker.appendChild(square);
        } else if (symbol === 'F') {
            const square = document.createElement('div');
            square.className = 'marker-f';
            marker.appendChild(square);
        } else if (symbol !== '0') {
            marker.textContent = symbol;
        }
        
        rowMarkers.appendChild(marker);
    }
};

image.addEventListener('load', () => {
    // scale limit so one pixel is at most ~24px (roughly size of a couple letters)
    const MAX_SCALE = 24;
    imageWrapper.style.maxHeight = `${image.naturalHeight * MAX_SCALE}px`;
    updateGridScale();
    const symbols = currentPattern && currentPattern.ayabSymbols ? currentPattern.ayabSymbols : null;
    renderRowMarkers(symbols);
    const chartData = generateChartData(extractPatternData(image, symbols));
    currentChartData = chartData;
    renderChart(chartData, chartOutput);
    renderTiledChart(chartData, tiledOutput);
});

const chartResizeObserver = new ResizeObserver(() => {
    if (currentChartData) renderChart(currentChartData, chartOutput);
});
chartResizeObserver.observe(chartOutput.parentElement);

const scaleObserver = new ResizeObserver(() => updateGridScale());
scaleObserver.observe(image);

const tiledOutput = document.getElementById('tiled-output');
const patternSelect = document.getElementById('pattern-select');
const patternFilter = document.getElementById('pattern-filter');
const patternList = document.getElementById('pattern-list');
const prevButton = document.getElementById('prev-button');
const nextButton = document.getElementById('next-button');

let currentChartData = null;

const tiledObserver = new ResizeObserver(() => {
    if (currentChartData) renderTiledChart(currentChartData, tiledOutput);
});
tiledObserver.observe(tiledOutput.parentElement);

let filteredPatterns = patterns.slice();
let currentPattern = null;

function updateViewer(pattern) {
    currentPattern = pattern;
    if (pattern.ayabSymbols === undefined) pattern.ayabSymbols = null;
    chartOutput.innerHTML = '';
    tiledOutput.innerHTML = '';
    getAyabSymbols(pattern.imageFile).then(symbols => {
        if (currentPattern === pattern) {
            pattern.ayabSymbols = symbols;
            renderRowMarkers(symbols);
            if (image.complete && image.naturalWidth) {
                const chartData = generateChartData(extractPatternData(image, symbols));
                currentChartData = chartData;
                renderChart(chartData, chartOutput);
                renderTiledChart(chartData, tiledOutput);
            }
        }
    });

    image.src = pattern.imageFile;
    patternSelect.value = pattern.label;
    window.location.hash = pattern.label;

    let activeButton = null;
    Array.from(patternList.querySelectorAll('button')).forEach((button) => {
        const isActive = button.dataset.pattern === pattern.label;
        button.classList.toggle('active', isActive);
        if (isActive) {
            activeButton = button;
        }
    });

    if (activeButton) {
        activeButton.scrollIntoView({ block: 'nearest' });
    }

    const index = filteredPatterns.findIndex((entry) => entry.label === pattern.label);
    prevButton.disabled = index <= 0;
    nextButton.disabled = index === -1 || index >= filteredPatterns.length - 1;
}

function renderList() {
    patternList.textContent = '';

    filteredPatterns.forEach((pattern) => {
        const button = document.createElement('button');
        button.type = 'button';
        button.textContent = `Pattern ${pattern.label}`;
        button.dataset.pattern = pattern.label;
        button.addEventListener('click', () => updateViewer(pattern));
        patternList.appendChild(button);
    });

    if (!filteredPatterns.some((pattern) => currentPattern && pattern.label === currentPattern.label)) {
        updateViewer(filteredPatterns[0] || patterns[0]);
    } else {
        updateViewer(currentPattern);
    }
}

function applyFilter() {
    const query = patternFilter.value.trim();
    filteredPatterns = patterns.filter((pattern) => pattern.label.includes(query));
    renderList();
}

function stepPattern(direction) {
    const index = filteredPatterns.findIndex((entry) => currentPattern && entry.label === currentPattern.label);
    if (index === -1) {
        return;
    }
    const nextIndex = index + direction;
    if (nextIndex < 0 || nextIndex >= filteredPatterns.length) {
        return;
    }
    updateViewer(filteredPatterns[nextIndex]);
}

patterns.forEach((pattern) => {
    const option = document.createElement('option');
    option.value = pattern.label;
    option.textContent = `Pattern ${pattern.label}`;
    patternSelect.appendChild(option);
});

patternSelect.addEventListener('change', () => {
    const selected = patterns.find((pattern) => pattern.label === patternSelect.value);
    if (selected) {
        updateViewer(selected);
    }
});

patternFilter.addEventListener('input', applyFilter);
prevButton.addEventListener('click', () => stepPattern(-1));
nextButton.addEventListener('click', () => stepPattern(1));

document.addEventListener('keydown', (event) => {
    const target = event.target;
    const tagName = target && target.tagName ? target.tagName.toLowerCase() : '';
    const isEditable = target && (target.isContentEditable || tagName === 'input' || tagName === 'select' || tagName === 'textarea');
    if (isEditable) {
        return;
    }

    if (event.key === 'ArrowUp') {
        event.preventDefault();
        stepPattern(-1);
    } else if (event.key === 'ArrowDown') {
        event.preventDefault();
        stepPattern(1);
    }
});

const hashPattern = window.location.hash.replace('#', '');
const initialPattern = patterns.find((pattern) => pattern.label === hashPattern) || patterns[0];
currentPattern = initialPattern;
renderList();
</script>
</body>
