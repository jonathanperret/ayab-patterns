<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>StitchWorld Lace Pattern Browser</title>
<style>
:root {
    color-scheme: light;
    --bg: #f3efe4;
    --panel: #fffdf7;
    --ink: #2f261a;
    --muted: #766650;
    --line: #d8ccb7;
    --accent: #9c4f2f;
    --accent-soft: #f1ddd1;
}

* {
    box-sizing: border-box;
}

html,
body {
    height: 100%;
    margin: 0;
}

body {
    font-family: Georgia, "Times New Roman", serif;
    background: radial-gradient(circle at top, #fff9ef 0%, var(--bg) 58%, #e7dcc7 100%);
    color: var(--ink);
}

.layout {
    display: grid;
    grid-template-columns: 18rem 1fr;
    height: 100vh;
}

.sidebar {
    display: grid;
    grid-template-rows: auto 1fr;
    border-right: 1px solid var(--line);
    background: linear-gradient(180deg, rgba(255, 253, 247, 0.96), rgba(247, 240, 226, 0.96));
    padding: 1rem;
    min-height: 0;
    backdrop-filter: blur(8px);
}

.sidebar-top {
    min-height: 0;
}

.title {
    margin: 0 0 0.25rem;
    font-size: 1.35rem;
    line-height: 1.1;
}

.subtitle {
    margin: 0 0 1rem;
    color: var(--muted);
    font-size: 0.95rem;
}

label {
    display: grid;
    gap: 0.35rem;
    font-size: 0.85rem;
    color: var(--muted);
}

input,
select,
button {
    font: inherit;
}

input,
select {
    width: 100%;
    padding: 0.55rem 0.65rem;
    border: 1px solid var(--line);
    border-radius: 0.5rem;
    background: var(--panel);
    color: var(--ink);
}

.nav-buttons {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 0.5rem;
}

button {
    padding: 0.6rem 0.75rem;
    border: 1px solid var(--line);
    border-radius: 999px;
    background: var(--panel);
    color: var(--ink);
    cursor: pointer;
}

button:hover {
    border-color: var(--accent);
    background: var(--accent-soft);
}

.list {
    min-height: 0;
    overflow: auto;
    padding-right: 0.35rem;
    display: grid;
    gap: 0.3rem;
}

.list button {
    text-align: left;
    border-radius: 0.65rem;
    padding: 0.55rem 0.7rem;
}

.list button.active {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff8ef;
}

.viewer-shell {
    display: grid;
    grid-template-rows: 1fr;
    min-width: 0;
    min-height: 0;
}

.viewer-content {
    display: grid;
    grid-template-columns: 30% 1fr;
    grid-template-rows: 1fr;
    min-height: 0;
}

.viewer-pane {
    position: relative;
    min-height: 0;
    overflow: hidden;
}

.left-column {
    display: grid;
    grid-template-rows: 1fr 1fr;
    min-height: 0;
    overflow: hidden;
    border-right: 1px solid var(--line);
}

.chart-output-pane {
    border-top: 1px solid var(--line);
    background: var(--panel);
    overflow: auto;
    padding: 1rem;
    display: flex;
}

.chart-pane {
    overflow: hidden;
    background: var(--panel);
}

#tiled-output {
    width: 100%;
    height: 100%;
}

#image-output,
#chart-output {
    margin: auto;
    display: flex;
}

.chart-grid {
    display: inline-grid;
    gap: 1px;
    background: #ccc;
    border: 1px solid #ccc;
}

.chart-cell {
    display: flex;
    align-items: center;
    justify-content: center;
    background: white;
    box-sizing: border-box;
}

.chart-cell img {
    width: 100%;
    height: 100%;
    display: block;
}

.marker-n {
    width: 65%;
    height: 65%;
    border: 1px solid var(--ink);
}

.marker-f {
    width: 65%;
    height: 65%;
    background-color: var(--ink);
}

.image-pane {
    display: flex;
    background: var(--panel);
    overflow: auto;
    padding: 1rem;
}

iframe {
    width: 100%;
    height: 100%;
    border: 0;
    background: white;
}

@media (max-width: 900px) {
    .layout {
        grid-template-columns: 1fr;
        grid-template-rows: auto 1fr;
    }

    .sidebar {
        border-right: 0;
        border-bottom: 1px solid var(--line);
        max-height: 45vh;
    }
}
</style>
</head>
<body>
<div class="layout">
    <aside class="sidebar">
        <div class="sidebar-top">
            <h1 class="title">StitchWorld Lace Pattern Browser</h1>
            <p class="subtitle">View lace patterns as charts.</p>
        </div>
        <div class="list" id="pattern-list"></div>
    </aside>

    <main class="viewer-shell">
        <div class="viewer-content">
            <div class="left-column">
                <div class="viewer-pane image-pane">
                    <div id="image-output"></div>
                </div>
                <div class="viewer-pane chart-output-pane">
                    <div id="chart-output"></div>
                </div>
            </div>
            <div class="viewer-pane chart-pane">
                <div id="tiled-output"></div>
            </div>
        </div>
    </main>
</div>

<script>
function getAyabSymbols(buffer) {
    try {
        const dataView = new DataView(buffer);
        
        // Check signature
        if (dataView.getUint32(0) !== 0x89504E47 || dataView.getUint32(4) !== 0x0D0A1A0A) {
            return null;
        }
        
        let offset = 8;
        while (offset < buffer.byteLength) {
            const length = dataView.getUint32(offset);
            const type = String.fromCharCode(
                dataView.getUint8(offset + 4),
                dataView.getUint8(offset + 5),
                dataView.getUint8(offset + 6),
                dataView.getUint8(offset + 7)
            );
            
            if (type === 'tEXt') {
                let chunkOffset = offset + 8;
                let chunkEnd = chunkOffset + length;
                let keyword = '';
                while (chunkOffset < chunkEnd) {
                    const char = dataView.getUint8(chunkOffset);
                    if (char === 0) {
                        chunkOffset++;
                        break;
                    }
                    keyword += String.fromCharCode(char);
                    chunkOffset++;
                }
                if (keyword === 'Comment') {
                    const textDecoder = new TextDecoder('utf-8');
                    const comment = textDecoder.decode(new Uint8Array(buffer, chunkOffset, chunkEnd - chunkOffset));
                    if (comment.startsWith('AYAB:')) {
                        return comment.substring(5).trim();
                    }
                }
            }
            
            offset += 8 + length + 4; // 4 length + 4 type + length + 4 crc
        }
    } catch (e) {
        console.error('Failed to read PNG metadata:', e);
    }
    return null;
}

const patterns = [
    ...Array.from({ length: 222 - 103 + 1 }, (_, index) => {
        const number = 103 + index;
        return {
            number,
            label: `StitchWorld #${number}`,
            imageFile: `StitchWorld/${number}.png`,
        };
    }),
    ...Array.from({ length: 205 - 108 + 1 }, (_, index) => {
        const number = 108 + index;
        return {
            number,
            label: `StitchWorld3 #${number}`,
            imageFile: `StitchWorld3/${number}.png`,
        };
    })
];

const image = new Image();
const imageOutput = document.getElementById('image-output');
const chartOutput = document.getElementById('chart-output');

/**
 * Reads image pixels into a boolean 2D array and packages the symbols.
 * Input:
 * - sourceImage: An HTMLImageElement containing the PNG pattern
 * - ayabSymbols: A string of metadata characters like "111N111..."
 * Output:
 * {
 *   width: number,
 *   height: number,
 *   rows: boolean[][] (true if pixel is black),
 *   ayabSymbols: string | null
 * }
 */
const extractPatternData = (sourceImage, ayabSymbols) => {
    if (!sourceImage.naturalWidth || !sourceImage.naturalHeight) return null;

    const canvas = document.createElement('canvas');
    canvas.width = sourceImage.naturalWidth;
    canvas.height = sourceImage.naturalHeight;
    const ctx = canvas.getContext('2d', {willReadFrequently: true});
    ctx.drawImage(sourceImage, 0, 0);
    const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height).data;

    const width = canvas.width;
    const height = canvas.height;
    const rows = [];
    
    for (let y = 0; y < height; y++) {
        const row = [];
        for (let x = 0; x < width; x++) {
            const i = (y * width + x) * 4;
            row.push(imgData[i] < 128 && imgData[i + 3] > 128);
        }
        rows.push(row);
    }

    return { width, height, rows, ayabSymbols };
};

/**
 * Transforms the raw boolean mask into the structural AYAB format.
 * Input:
 * - patternData: The output from `extractPatternData`
 * Output:
 * {
 *   mergedBlocks: { label: string, cells: string[], rowNum: number | null, startRow: number | null }[],
 *   ayabSymbols: string | null,
 *   ayabBlocks: { [row: number]: number } | null
 * }
 */
const generateChartData = (patternData) => {
    if (!patternData) return null;
    
    const { width, height, rows, ayabSymbols } = patternData;

    const chartRows = [];
    for (let knitRow = 1; knitRow <= height; knitRow++) {
        const y = height - knitRow;
        const rightRow = (knitRow % 2 === 0);
        let holeAction = 'hole';
        if (ayabSymbols && ayabSymbols.length >= knitRow) {
            if (ayabSymbols[knitRow - 1] === 'F') holeAction = 'fine-hole';
        }
        
        let cells = Array(width).fill('knit');
        const rowPixels = rows[y];
        for (let x = 0; x < width; x++) {
            const isBlack = rowPixels[x];
            if (isBlack) {
                if (rightRow) {
                    cells[x] = holeAction;
                    cells[(x + 1) % width] = 'transfer-right';
                } else {
                    cells[x] = holeAction;
                    cells[(x - 1 + width) % width] = 'transfer-left';
                }
            }
        }
        chartRows.push({ rowNum: knitRow, cells });
    }

    let ayabBlocks = null;
    if (ayabSymbols && ayabSymbols.length >= height) {
        ayabBlocks = {};
        let blockNum = 1;
        for (let r = 1; r <= height; r++) {
            const sym = ayabSymbols[r - 1];
            ayabBlocks[r] = blockNum;
            if (sym >= '1' && sym <= '9') blockNum++;
        }
    }

    let mergedBlocks = [];
    if (!ayabBlocks) {
        mergedBlocks = chartRows.map(r => ({ label: String(r.rowNum), cells: r.cells, rowNum: r.rowNum, startRow: r.rowNum }));
    } else {
        const rowsByBlock = {};
        const blockOrder = [];
        for (const row of chartRows) {
            const b = ayabBlocks[row.rowNum];
            if (!rowsByBlock[b]) {
                rowsByBlock[b] = [];
                blockOrder.push(b);
            }
            rowsByBlock[b].push(row);
        }

        for (const b of blockOrder) {
            const blockRows = rowsByBlock[b];
            let mergedCells = [...blockRows[0].cells];
            let startRow = blockRows[0].rowNum;
            const endRow = blockRows[blockRows.length - 1].rowNum;

            for (let i = 1; i < blockRows.length; i++) {
                const topCells = blockRows[i].cells;
                for (let x = 0; x < width; x++) {
                    const bottom = mergedCells[x];
                    const top = topCells[x];
                    if (bottom === 'knit' && top === 'knit') mergedCells[x] = 'knit';
                    else if (bottom === 'knit') mergedCells[x] = top;
                    else if (top === 'knit') mergedCells[x] = bottom;
                    else if ((bottom === 'transfer-right' && top === 'transfer-left') || (bottom === 'transfer-left' && top === 'transfer-right')) mergedCells[x] = 'crossover';
                    else if ((top === 'transfer-right' || top === 'transfer-left') && (bottom === 'hole' || bottom === 'fine-hole')) mergedCells[x] = top;
                    else mergedCells[x] = top;
                }
            }
            const label = startRow === endRow ? String(startRow) : `${startRow}-${endRow}`;
            mergedBlocks.push({ label, cells: mergedCells, rowNum: endRow, startRow });

            const sym = ayabSymbols[endRow - 1];
            if (sym >= '3' && sym <= '9') {
                const extra = parseInt(sym, 10) - 2;
                for (let i = 0; i < extra; i++) {
                    mergedBlocks.push({ label: '', cells: Array(width).fill('knit'), startRow: null, rowNum: null });
                }
            }
        }
    }

    // Pass to mark the ends of consecutive transfer sequences
    for (const block of mergedBlocks) {
        if (!block.cells) continue;
        const original = [...block.cells];
        for (let x = 0; x < width; x++) {
            if (original[x] === 'transfer-right' && original[(x + 1) % width] !== 'transfer-right') {
                block.cells[x] = 'transfer-right-end';
            }
            if (original[x] === 'transfer-left' && original[(x - 1 + width) % width] !== 'transfer-left') {
                block.cells[x] = 'transfer-left-end';
            }
        }
    }

    return { mergedBlocks, ayabSymbols, ayabBlocks };
};

/**
 * Render the abstract chart blocks into DOM elements.
 * Input:
 * - chartData: The output from `generateChartData`
 * - container: The DOM element to populate
 */
const renderChart = (chartData, container) => {
    container.innerHTML = '';
    if (!chartData || chartData.mergedBlocks.length === 0) return;
    const { mergedBlocks } = chartData;

    const cols = mergedBlocks[0].cells.length;
    const rows = mergedBlocks.length;

    const MARGIN = 16; // px, ~2rem
    const pane = container.parentElement;
    const availW = pane.clientWidth - MARGIN * 2;
    const availH = pane.clientHeight - MARGIN * 2;
    const cellSize = Math.max(1, Math.min(
        Math.floor((availW - cols - 1) / cols),
        Math.floor((availH - rows - 1) / rows)
    ));

    const width = mergedBlocks[0].cells.length;

    const lineW = Math.max(0.1, Math.min(1, cellSize / 5));
    const borderBlack = `${lineW}px solid black`;
    const borderCcc = `${lineW}px solid #ccc`;

    const grid = document.createElement('div');
    grid.className = 'chart-grid';
    grid.style.gridTemplateColumns = `repeat(${width}, ${cellSize}px)`;
    grid.style.gridTemplateRows = `repeat(${rows}, ${cellSize}px)`;
    grid.style.gap = '0';
    grid.style.border = 'none';
    grid.style.borderTop = (rows % 5 === 0) ? borderBlack : borderCcc;
    grid.style.borderLeft = borderBlack;
    grid.style.background = 'transparent';

    const GLYPH_MAP = {
        'knit':               'glyphs/U002D.svg',
        'hole':               'glyphs/U006F.svg',
        'fine-hole':          'glyphs/U006F.svg',
        'transfer-right':     'glyphs/U002F.svg',
        'transfer-right-end': 'glyphs/UF055.svg',
        'transfer-left':      'glyphs/U005C.svg',
        'transfer-left-end':  'glyphs/UF056.svg',
        'crossover':          'glyphs/UF06A.svg',
    };

    const reversed = [...mergedBlocks].reverse();
    for (let i = 0; i < reversed.length; i++) {
        const b = reversed[i];
        const rowFromBottom = rows - 1 - i;

        for (let x = 0; x < width; x++) {
            const type = b.cells[x];
            const cell = document.createElement('div');
            cell.className = `chart-cell chart-cell--${type}`;
            cell.style.borderBottom = (rowFromBottom % 5 === 0) ? borderBlack : borderCcc;
            cell.style.borderRight = ((x + 1) % 5 === 0) ? borderBlack : borderCcc;
            
            const src = GLYPH_MAP[type];
            if (src) {
                const img = document.createElement('img');
                img.src = src;
                img.alt = type;
                cell.appendChild(img);
            }
            grid.appendChild(cell);
        }
    }
    container.appendChild(grid);
};

/**
 * Render the chart tiled to fill the given number of columns and rows.
 * Input:
 * - chartData: The output from `generateChartData`
 * - container: The DOM element to populate
 */
const renderTiledChart = (chartData, container) => {
    container.innerHTML = '';
    if (!chartData || chartData.mergedBlocks.length === 0) return;
    const { mergedBlocks } = chartData;

    const patternRows = [...mergedBlocks].reverse();
    const numRows = patternRows.length;
    const width = patternRows[0].cells.length;

    const CELL_SIZE_PX = 14; // 0.875rem at 16px base
    const pane = container.parentElement;
    const tiledCols = Math.max(1, Math.floor(pane.clientWidth / CELL_SIZE_PX));
    const tiledRows = Math.max(1, Math.floor(pane.clientHeight / CELL_SIZE_PX));

    const grid = document.createElement('div');
    grid.className = 'chart-grid';
    grid.style.gridTemplateColumns = `repeat(${tiledCols}, 0.875rem)`;
    grid.style.gridTemplateRows = `repeat(${tiledRows}, 0.875rem)`;
    grid.style.overflow = 'hidden';

    const GLYPH_MAP = {
        'knit':               'glyphs/U002D.svg',
        'hole':               'glyphs/U006F.svg',
        'fine-hole':          'glyphs/U006F.svg',
        'transfer-right':     'glyphs/U002F.svg',
        'transfer-right-end': 'glyphs/UF055.svg',
        'transfer-left':      'glyphs/U005C.svg',
        'transfer-left-end':  'glyphs/UF056.svg',
        'crossover':          'glyphs/UF06A.svg',
    };

    for (let r = 0; r < tiledRows; r++) {
        const patternRow = patternRows[r % numRows];
        for (let c = 0; c < tiledCols; c++) {
            const type = patternRow.cells[c % width];
            const cell = document.createElement('div');
            cell.className = `chart-cell chart-cell--${type}`;
            const src = GLYPH_MAP[type];
            if (src) {
                const img = document.createElement('img');
                img.src = src;
                img.alt = type;
                cell.appendChild(img);
            }
            grid.appendChild(cell);
        }
    }
    container.appendChild(grid);
};

/**
 * Render the raw pattern data into DOM elements.
 * Input:
 * - patternData: The output from `extractPatternData`
 * - container: The DOM element to populate
 */
const renderPattern = (patternData, container) => {
    container.innerHTML = '';
    if (!patternData || patternData.rows.length === 0) return;
    
    const { width, height, rows, ayabSymbols } = patternData;

    const MARGIN = 16; // px, ~2rem
    const pane = container.parentElement;
    const availW = pane.clientWidth - MARGIN * 2;
    const availH = pane.clientHeight - MARGIN * 2;
    
    // Add 1 to width for the gutter
    const gridWidth = width + 1;
    
    const cellSize = Math.max(1, Math.min(
        Math.floor((availW - 1) / gridWidth),
        Math.floor((availH - 1) / height)
    ));
    
    // Scale gridline thickness for very small cell sizes to prevent the pattern from being visually overwhelmed by lines
    const lineW = Math.max(0.1, Math.min(1, cellSize / 5));
    const borderBlack = `${lineW}px solid black`;
    const borderCcc = `${lineW}px solid #ccc`;

    const wrapper = document.createElement('div');
    wrapper.style.display = 'flex';

    const gutterGrid = document.createElement('div');
    gutterGrid.style.display = 'grid';
    gutterGrid.style.gridTemplateRows = `repeat(${height}, ${cellSize}px)`;
    gutterGrid.style.gridTemplateColumns = `${cellSize}px`;
    gutterGrid.style.gap = '0';
    gutterGrid.style.border = 'none';
    gutterGrid.style.background = 'white';

    const grid = document.createElement('div');
    grid.className = 'chart-grid';
    grid.style.gridTemplateColumns = `repeat(${width}, ${cellSize}px)`;
    grid.style.gridTemplateRows = `repeat(${height}, ${cellSize}px)`;
    grid.style.gap = '0';
    grid.style.border = 'none';
    grid.style.borderTop = (height % 5 === 0) ? borderBlack : borderCcc;
    grid.style.borderLeft = 'none'; // The gutter's right border takes care of this
    grid.style.background = 'transparent';

    for (let y = 0; y < height; y++) {
        const rowPixels = rows[y];
        const i = height - 1 - y;
        
        const gutterCell = document.createElement('div');
        gutterCell.className = 'chart-cell';
        gutterCell.style.fontSize = `${Math.max(6, cellSize * 0.8)}px`;
        gutterCell.style.fontFamily = 'sans-serif';
        gutterCell.style.color = 'black';
        gutterCell.style.borderBottom = 'none';
        gutterCell.style.borderRight = borderBlack;
        
        let symbol = '';
        if (ayabSymbols && ayabSymbols.length > i) {
            symbol = ayabSymbols[i];
        }
        
        if (symbol === 'N') {
            const square = document.createElement('div');
            square.className = 'marker-n';
            gutterCell.appendChild(square);
        } else if (symbol === 'F') {
            const square = document.createElement('div');
            square.className = 'marker-f';
            gutterCell.appendChild(square);
        } else if (symbol && symbol !== '0') {
            gutterCell.textContent = symbol;
        }
        gutterGrid.appendChild(gutterCell);

        for (let x = 0; x < width; x++) {
            const isBlack = rowPixels[x];
            const cell = document.createElement('div');
            cell.className = 'chart-cell';
            cell.style.borderBottom = (i % 5 === 0) ? borderBlack : borderCcc;
            cell.style.borderRight = ((x + 1) % 5 === 0) ? borderBlack : borderCcc;
            if (isBlack) {
                cell.style.backgroundColor = 'var(--ink)';
            }
            grid.appendChild(cell);
        }
    }
    
    wrapper.appendChild(gutterGrid);
    wrapper.appendChild(grid);
    container.appendChild(wrapper);
};

image.addEventListener('load', () => {
    const symbols = currentPattern && currentPattern.ayabSymbols ? currentPattern.ayabSymbols : null;
    const patternData = extractPatternData(image, symbols);
    currentPatternData = patternData;
    renderPattern(patternData, imageOutput);

    const chartData = generateChartData(patternData);
    currentChartData = chartData;
    renderChart(chartData, chartOutput);
    renderTiledChart(chartData, tiledOutput);
});

let currentPatternData = null;
let currentChartData = null;

const paneResizeObserver = new ResizeObserver((entries) => {
    for (const entry of entries) {
        if (entry.target === imageOutput.parentElement && currentPatternData) {
            renderPattern(currentPatternData, imageOutput);
        } else if (entry.target === chartOutput.parentElement && currentChartData) {
            renderChart(currentChartData, chartOutput);
        }
    }
});
paneResizeObserver.observe(imageOutput.parentElement);
paneResizeObserver.observe(chartOutput.parentElement);

const tiledOutput = document.getElementById('tiled-output');
const patternList = document.getElementById('pattern-list');

const tiledObserver = new ResizeObserver(() => {
    if (currentChartData) renderTiledChart(currentChartData, tiledOutput);
});
tiledObserver.observe(tiledOutput.parentElement);

let currentPattern = null;
let currentImageUrl = null;

function updateViewer(pattern) {
    currentPattern = pattern;
    if (pattern.ayabSymbols === undefined) pattern.ayabSymbols = null;
    imageOutput.innerHTML = '';
    chartOutput.innerHTML = '';
    tiledOutput.innerHTML = '';
    
    fetch(pattern.imageFile)
        .then(res => res.arrayBuffer())
        .then(buffer => {
            if (currentPattern === pattern) {
                pattern.ayabSymbols = getAyabSymbols(buffer);
                const blob = new Blob([buffer], { type: 'image/png' });
                if (currentImageUrl) {
                    URL.revokeObjectURL(currentImageUrl);
                }
                currentImageUrl = URL.createObjectURL(blob);
                image.src = currentImageUrl;
            }
        });

    window.location.hash = encodeURIComponent(pattern.imageFile);

    let activeButton = null;
    Array.from(patternList.querySelectorAll('button')).forEach((button) => {
        const isActive = button.dataset.pattern === pattern.imageFile;
        button.classList.toggle('active', isActive);
        if (isActive) {
            activeButton = button;
        }
    });

    if (activeButton) {
        activeButton.scrollIntoView({ block: 'nearest' });
    }
}

function renderList() {
    patternList.textContent = '';

    patterns.forEach((pattern) => {
        const button = document.createElement('button');
        button.type = 'button';
        button.textContent = pattern.label;
        button.dataset.pattern = pattern.imageFile;
        button.addEventListener('click', () => updateViewer(pattern));
        patternList.appendChild(button);
    });

    if (!patterns.some((pattern) => currentPattern && pattern.imageFile === currentPattern.imageFile)) {
        updateViewer(patterns[0]);
    } else {
        updateViewer(currentPattern);
    }
}

function stepPattern(direction) {
    const index = patterns.findIndex((entry) => currentPattern && entry.imageFile === currentPattern.imageFile);
    if (index === -1) {
        return;
    }
    const nextIndex = index + direction;
    if (nextIndex < 0 || nextIndex >= patterns.length) {
        return;
    }
    updateViewer(patterns[nextIndex]);
}

document.addEventListener('keydown', (event) => {
    const target = event.target;
    const tagName = target && target.tagName ? target.tagName.toLowerCase() : '';
    const isEditable = target && (target.isContentEditable || tagName === 'input' || tagName === 'select' || tagName === 'textarea');
    if (isEditable) {
        return;
    }

    if (event.key === 'ArrowUp') {
        event.preventDefault();
        stepPattern(-1);
    } else if (event.key === 'ArrowDown') {
        event.preventDefault();
        stepPattern(1);
    }
});

const hashPattern = decodeURIComponent(window.location.hash.replace('#', ''));
const initialPattern = patterns.find((pattern) => pattern.imageFile === hashPattern) || patterns[0];
currentPattern = initialPattern;
renderList();
</script>
</body>
</html>
